version: 2

builds:
  - id: solactl
    main: ./cmd/solactl
    binary: solactl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/solapi/solactl/internal/version.Version={{.Version}}
      - -X github.com/solapi/solactl/internal/version.Commit={{.Commit}}
      - -X github.com/solapi/solactl/internal/version.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

# Sign checksums.txt with cosign keyless (Sigstore + Fulcio + Rekor).
# Produces checksums.txt.sig and checksums.txt.pem alongside the checksums
# file in the GitHub release. Verification is documented in README.md
# under the "Advanced: signature verification" section.
signs:
  - id: checksums-cosign
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    output: true

changelog:
  disable: true

release:
  github:
    owner: solapi
    name: solactl
  prerelease: auto
