version: 2

builds:
  - id: solactl
    main: ./cmd/solactl
    binary: solactl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/solapi/solactl/internal/version.Version={{.Version}}
      - -X github.com/solapi/solactl/internal/version.Commit={{.Commit}}
      - -X github.com/solapi/solactl/internal/version.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: solapi
    name: solactl
  prerelease: auto
